# 生产用 compose：直接拉取已发布的镜像，无需源码构建。
#   docker compose -f docker-compose.prod.yml up -d
# 零配置即可起；打开 http://<host>:8787/admin 创建管理员并填写上游即可使用。
services:
  toolcall-gateway:
    image: ${TCG_IMAGE:-ghcr.io/kaoqy/tool-calls-gateway:v1.3.0}
    container_name: toolcall-gateway
    ports:
      - "${HOST_PORT:-8787}:8787"
    environment:
      PORT: "8787"
      # 以下是可选项，全部留空也能用（配置都在 /admin 网页里）
      # UPSTREAM_BASE_URL: "" 
      # UPSTREAM_API_KEY: ""
      # DEFAULT_MODEL: ""
      # GATEWAY_API_KEY: ""
      # ADMIN_TOKEN: ""
    restart: unless-stopped
    read_only: true
    volumes:
      - tcg-data:/app/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  tcg-data:
