name: ci-and-publish

# 测试 → 构建多架构镜像 → 推送到 GitHub Container Registry (GHCR)
# 打 tag（如 v1.0.0）时产出 ghcr.io/<owner>/<repo>:v1.0.0

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 零运行时依赖校验
        run: |
          node -e "
            const p = require('./package.json');
            const deps = { ...(p.dependencies || {}), ...(p.devDependencies || {}) };
            if (Object.keys(deps).length) {
              console.error('检测到第三方依赖（违反零依赖约束）:', deps);
              process.exit(1);
            }
            console.log('零依赖 OK');
          "

      - name: 部署脚本语法检查
        run: |
          sh -n deploy.sh
          bash -n deploy.sh

      - name: 单元测试
        run: npm test

      - name: 全量离线 gate（M0~M6 + M8 + M10~M12）
        run: npm run gate

      - name: 密钥泄漏扫描（只匹配真实 key 形态，避免误报测试用假值）
        run: |
          set -eu
          PAT='sk-[A-Za-z0-9]{24,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}'
          if grep -rIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=out \
               --exclude='.env*' -E "$PAT" . ; then
            echo "::error::检测到疑似真实密钥，请移除后再提交"
            exit 1
          fi
          echo "未发现真实形态的密钥（sk-test / sk-dummy 等测试假值不计）"

  docker:
    name: 构建并推送镜像（GHCR）
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 计算小写镜像名
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.img.outputs.name }}
          labels: |
            org.opencontainers.image.title=toolcall-gateway
            org.opencontainers.image.description=OpenAI-compatible gateway that simulates tool calling on a plain-chat upstream
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build & Push（linux/amd64 + linux/arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 写入 Job Summary
        run: |
          {
            echo "### 镜像已推送"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: 镜像冒烟（零配置起容器 + 首次初始化）
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 本地构建 amd64 镜像
        run: docker build -t toolcall-gateway:smoke .

      - name: 零配置起容器（不给任何环境变量）
        run: |
          set -eu
          docker run -d --name tc-smoke -p 8787:8787 \
            -v tc-smoke-data:/app/data \
            toolcall-gateway:smoke
          ok=""
          for i in $(seq 1 40); do
            if body=$(curl -fsS http://127.0.0.1:8787/healthz 2>/dev/null); then ok="$body"; break; fi
            sleep 1
          done
          echo "healthz=$ok"
          echo "$ok" | grep -q '"status":"ok"'
          echo "$ok" | grep -q '"setupRequired":true'
          echo "$ok" | grep -q '"upstreamConfigured":false'

      - name: 非 root 运行
        run: |
          set -eu
          user=$(docker inspect --format '{{.Config.User}}' toolcall-gateway:smoke)
          echo "container user=$user"
          test "$user" = "node"
          touch_ok=$(docker exec tc-smoke node -e "require('node:fs').writeFileSync('/app/data/.probe','x');console.log('writable')")
          echo "data dir: $touch_ok"
          test "$touch_ok" = "writable"

      - name: 未初始化时：/admin 是初始化向导，/v1 明确 503
        run: |
          set -eu
          code=$(curl -s -o /tmp/setup.html -w '%{http_code}' http://127.0.0.1:8787/admin)
          echo "admin -> $code"
          test "$code" = "200"
          grep -q '完成初始化' /tmp/setup.html
          grep -q 'id="upstreamBaseUrl"' /tmp/setup.html

          body=$(curl -s -X POST http://127.0.0.1:8787/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"x","messages":[{"role":"user","content":"hi"}]}')
          echo "v1 -> $body"
          echo "$body" | grep -q 'upstream_not_configured'

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/admin/api/settings)
          echo "settings without session -> $code"
          test "$code" = "401"

      - name: 首次初始化：网页创建管理员 + 配上游（全走 HTTP，不需要 env）
        run: |
          set -eu
          code=$(curl -s -c /tmp/cookies.txt -o /tmp/setup.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8787/admin/api/setup \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"smoke-test-password","upstreamBaseUrl":"https://example.com","upstreamApiKey":"sk-smoke-not-real","defaultModel":"smoke-model"}')
          echo "setup -> $code"
          test "$code" = "201"
          grep -q 'tcg_sess' /tmp/cookies.txt
          grep -q '"username":"admin"' /tmp/setup.json
          if grep -q 'sk-smoke-not-real' /tmp/setup.json; then echo "::error::响应回显了上游明文密钥"; exit 1; fi

          curl -fsS http://127.0.0.1:8787/healthz | grep -q '"setupRequired":false'
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:8787/admin | grep -q 'id="modelMap"'
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:8787/admin/api/settings | grep -q '"sources"'

          # 再次初始化必须 409（窗口已关闭）
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/admin/api/setup \
            -H 'content-type: application/json' \
            -d '{"username":"hacker","password":"hacker-password","upstreamBaseUrl":"https://evil.example"}')
          echo "second setup -> $code"
          test "$code" = "409"

      - name: 重启后配置仍在（数据卷持久化），且要求重新登录
        run: |
          set -eu
          docker rm -f tc-smoke
          docker run -d --name tc-smoke -p 8787:8787 -v tc-smoke-data:/app/data toolcall-gateway:smoke
          for i in $(seq 1 40); do
            if body=$(curl -fsS http://127.0.0.1:8787/healthz 2>/dev/null); then break; fi
            sleep 1
          done
          echo "healthz after restart=$body"
          echo "$body" | grep -q '"setupRequired":false'
          echo "$body" | grep -q '"upstreamConfigured":true'
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/cookies.txt http://127.0.0.1:8787/admin/api/settings)
          echo "old session after restart -> $code"
          test "$code" = "401"
          curl -fsS http://127.0.0.1:8787/admin | grep -q '登录'
          docker logs tc-smoke | tail -n 20

      - name: 清理
        if: always()
        run: |
          docker rm -f tc-smoke || true
          docker volume rm tc-smoke-data || true
