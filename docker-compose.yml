services:
  toolcall-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: toolcall-gateway:dev
    container_name: toolcall-gateway
    ports:
      - "${HOST_PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
    volumes:
      - tcg-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  tcg-data:
